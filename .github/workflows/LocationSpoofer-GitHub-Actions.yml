      - name: Build signed scoped debug APKs
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleScopedDebug --stacktrace

      - name: Show installed package signing SHA1
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -m1 SHA1 || true
          fi
          echo 'The new in-app AMap settings launcher also shows the exact certificate SHA1.'

      - name: Upload installable test APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-AMap-Scoped-Debug-APK
          path: project/app/build/outputs/apk/scoped/debug/*.apk
          if-no-files-found: error
          retention-days: 14
