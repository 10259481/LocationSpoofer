name: LocationSpoofer 3.0.15 Stage11 AMap Final

run-name: Stage11 AMap Final Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-in-app-amap-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK without the interactive license step
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android 35 SDK for small SDK helper project
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

