name: Build LocationSpoofer With AMap Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out public upstream source
        uses: actions/checkout@v4
        with:
          repository: HuangZhuoRui/LocationSpoofer
          ref: main
          path: project
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Install platform tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
      - name: Restore debug signing certificate cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-locationspoofer-amap-v2-debug-certificate-v1

