          test -s patch/AMapSandboxActivity.java
          echo "Patch sources recovered."

      - name: Download verified official APK and Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 \
            'https://github.com/HuangZhuoRui/LocationSpoofer/releases/download/v3.0.15/LocationSpoofer-v3.0.15-global-64bit-arm64-v8a.apk' \
            -o work/original.apk
          echo 'c2d06ab8164b57f11af2c8a5fc2c0e2312540305529529bfd95c4877dfb0105b  work/original.apk' | sha256sum -c -
          curl -fLsS --retry 4 --retry-delay 3 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o tools/apktool.jar
          java -Xmx4g -jar tools/apktool.jar d -f work/original.apk -o work/decoded

      - name: Build a standalone real AMap SDK map page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/helper/src/main/java/com/vincenthzr/locationspoofer
          cat > work/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AMapStage10Scratch'
          include ':helper'
          EOF
          cat > work/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > work/helper/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vincenthzr.locationspoofer.sandbox'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.vincenthzr.locationspoofer.sandbox'
                  minSdk 26
                  targetSdk 28
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'
          }
          EOF
          cat > work/helper/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="AMap SDK Scratch">
              <activity android:name="com.vincenthzr.locationspoofer.AMapSandboxActivity" android:exported="true"/>
            </application>
          </manifest>
          EOF
          cp patch/AMapSandboxActivity.java work/helper/src/main/java/com/vincenthzr/locationspoofer/
          (cd work && gradle :helper:assembleDebug --no-daemon --stacktrace)
          test -f work/helper/build/outputs/apk/debug/helper-debug.apk
          echo '=== SDK scratch native libs (if any) ==='
          unzip -Z1 work/helper/build/outputs/apk/debug/helper-debug.apk | grep '^lib/' || true
          java -Xmx4g -jar tools/apktool.jar d -f work/helper/build/outputs/apk/debug/helper-debug.apk -o work/helper-decoded
          find work/helper-decoded -type f -name '*MapView*.smali' | head -20

      - name: Merge experimental AMap map page and existing Stage9 key page
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/apply_stage9.py work/decoded
          python3 patch/patch_stage10.py work/decoded
          python3 patch/merge_helper.py work/decoded work/helper-decoded
          grep -q 'AMapSandboxActivity' work/decoded/AndroidManifest.xml
          grep -q 'LocalAmapKeyActivity' work/decoded/AndroidManifest.xml

      - name: Rebuild and preserve the original sensor module
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx5g -jar tools/apktool.jar b work/decoded -o work/unsigned.apk
          unzip -p work/original.apk lib/arm64-v8a/liblocation_accel.so | sha256sum > work/original-sensor.sha256
          unzip -p work/unsigned.apk lib/arm64-v8a/liblocation_accel.so | sha256sum > work/rebuilt-sensor.sha256
          cmp work/original-sensor.sha256 work/rebuilt-sensor.sha256
          echo 'Preserved original v3.0.15 native sensor module (SHA256 match)' | tee output/checks.txt

      - name: Restore the SAME Stage9 test signing certificate
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: locationspoofer-315-stage9-debug-key-v1
          lookup-only: false

      - name: Zipalign and sign experimental test APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ALIGN="$(find "$SDK_DIR/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$SIGNER" && test -x "$ALIGN"
          if [ ! -s .signing/debug.keystore ]; then
            echo 'ERROR: The Stage9 signing key was not found in cache. Refusing to change SHA1 silently.' >&2
            exit 1
          fi
          FINGERPRINT=$(keytool -list -keystore .signing/debug.keystore -storepass android -alias androiddebugkey -v | sed -n 's/.*SHA1: //p' | head -n 1)
          echo "Cached signing key SHA1: $FINGERPRINT"
          if [[ "$FINGERPRINT" != '26:4D:FA:03:6D:DB:72:8E:8C:6B:91:AF:18:3D:B4:0C:80:50:B9:2D' ]]; then
            echo 'ERROR: Different SHA1. Do not silently invalidate the registered AMap Key.' >&2
            exit 1
          fi
          "$ALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          "$SIGNER" sign --ks .signing/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out output/LocationSpoofer-315-Stage10-AMapSDK-EXPERIMENTAL.apk work/aligned.apk
          "$SIGNER" verify --verbose --print-certs output/LocationSpoofer-315-Stage10-AMapSDK-EXPERIMENTAL.apk > output/signature-info.txt
          unzip -t output/LocationSpoofer-315-Stage10-AMapSDK-EXPERIMENTAL.apk >/dev/null
          cat > output/READ_ME_FIRST.txt <<'EOF'
          STAGE10 EXPERIMENTAL - not a finished map replacement!
