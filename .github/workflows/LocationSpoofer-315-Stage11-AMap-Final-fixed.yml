          PAYLOAD
          base64 -d patch/source.b64 > patch/source.tar.gz
          tar -xzf patch/source.tar.gz -C patch
          python3 -m py_compile patch/*.py
          test -s patch/AMapSandboxActivity.java
          test -s patch/MainAmapEmbed.java
          test -s patch/patch_stage11.py
          echo "Patch sources recovered."

      - name: Download verified official APK and Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 \
            'https://github.com/HuangZhuoRui/LocationSpoofer/releases/download/v3.0.15/LocationSpoofer-v3.0.15-global-64bit-arm64-v8a.apk' \
            -o work/original.apk
          echo 'c2d06ab8164b57f11af2c8a5fc2c0e2312540305529529bfd95c4877dfb0105b  work/original.apk' | sha256sum -c -
          curl -fLsS --retry 4 --retry-delay 3 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o tools/apktool.jar
          java -Xmx4g -jar tools/apktool.jar d -f work/original.apk -o work/decoded

      - name: Build AMap SDK and in-app map integration classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/helper/src/main/java/com/vincenthzr/locationspoofer
          cat > work/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AMapStage11Scratch'
          include ':helper'
          EOF
          cat > work/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > work/helper/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vincenthzr.locationspoofer.sandbox'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.vincenthzr.locationspoofer.sandbox'
                  minSdk 26
                  targetSdk 28
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'
          }
          EOF
          cat > work/helper/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="AMap SDK Scratch">
              <activity android:name="com.vincenthzr.locationspoofer.AMapSandboxActivity" android:exported="true"/>
            </application>
          </manifest>
          EOF
          cp patch/AMapSandboxActivity.java work/helper/src/main/java/com/vincenthzr/locationspoofer/
          cp patch/MainAmapEmbed.java work/helper/src/main/java/com/vincenthzr/locationspoofer/
          (cd work && gradle :helper:assembleDebug --no-daemon --stacktrace)
          test -f work/helper/build/outputs/apk/debug/helper-debug.apk
          echo '=== SDK scratch native libs (if any) ==='
          unzip -Z1 work/helper/build/outputs/apk/debug/helper-debug.apk | grep '^lib/' || true
          java -Xmx4g -jar tools/apktool.jar d -f work/helper/build/outputs/apk/debug/helper-debug.apk -o work/helper-decoded
          find work/helper-decoded -type f -name '*MapView*.smali' | head -20

      - name: Stage11 preflight check
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Stage11 workspace check ==="
          find work -maxdepth 3 -type f | head -100 || true
          test -d work/decoded
          test -f work/decoded/AndroidManifest.xml

      - name: Merge AMap SDK and patch ORIGINAL main-map view
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/apply_stage9.py work/decoded
          python3 patch/patch_stage10.py work/decoded
          python3 patch/merge_helper.py work/decoded work/helper-decoded
          python3 patch/patch_stage11.py work/decoded
          grep -q 'AMapSandboxActivity' work/decoded/AndroidManifest.xml
          grep -q 'LocalAmapKeyActivity' work/decoded/AndroidManifest.xml
          grep -q 'MainAmapEmbed;->attach' work/decoded/smali/tr2.smali

      - name: Compact multidex numbering before Apktool build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('work/decoded')
          def index(path):
              match = re.fullmatch(r'smali_classes(\d+)', path.name)
              return int(match.group(1)) if match else -1
          folders = sorted((p for p in root.glob('smali_classes*') if p.is_dir() and index(p) >= 2), key=index)
          populated = [p for p in folders if any(p.rglob('*.smali'))]
          assert populated, 'Expected AMap SDK secondary Smali folders'
          temporary = []
          for new_number, old in enumerate(populated, 2):
              temp = root / f'.amap_dex_compact_{new_number}'
              assert not temp.exists()
              old.rename(temp)
              temporary.append((temp, new_number))
          for old in folders:
              if old.exists():
                  assert not any(old.rglob('*.smali')), f'Unexpected leftover Smali files: {old}'
                  shutil.rmtree(old)
          for temp, new_number in temporary:
              temp.rename(root / f'smali_classes{new_number}')
          for name in sorted(p.name for p in root.glob('smali_classes*') if p.is_dir()):
              print('DEX source:',name)
          assert any((root / f'smali_classes{n}' / 'com/vincenthzr/locationspoofer/AMapSandboxActivity.smali').exists() for n in range(2, len(populated)+2)), 'Experiment activity missing'
          PY

      - name: Rebuild integrated main-map test with original sensor module
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx5g -jar tools/apktool.jar b work/decoded -o work/unsigned.apk
          python3 - <<'PY'
          import re, zipfile
          apk = 'work/unsigned.apk'
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              dex = sorted((n for n in names if re.fullmatch(r'classes(?:[2-9][0-9]*)?\.dex', n)), key=lambda n: 1 if n == 'classes.dex' else int(n[7:-4]))
              expected = ['classes.dex'] + [f'classes{i}.dex' for i in range(2, len(dex) + 1)]
              assert dex == expected, f'DEX numbering gap: {dex!r} != {expected!r}'
              assert any(b'AMapSandboxActivity' in z.read(n) for n in dex[1:]), 'AMap activity not found in secondary DEX'
              assert any(b'Lcom/amap/api/maps/MapView;' in z.read(n) for n in dex[1:]), 'AMap SDK MapView missing'
              assert b'MainAmapEmbed' in z.read('classes.dex'), 'Original main-map view NOT hooked'
              assert any(b'MainAmapEmbed' in z.read(n) for n in dex[1:]), 'Main AMap bridge missing'
              print('Verified contiguous DEX files:', dex)
          PY
          unzip -p work/original.apk lib/arm64-v8a/liblocation_accel.so | sha256sum > work/original-sensor.sha256
          unzip -p work/unsigned.apk lib/arm64-v8a/liblocation_accel.so | sha256sum > work/rebuilt-sensor.sha256
          cmp work/original-sensor.sha256 work/rebuilt-sensor.sha256
          echo 'Preserved original v3.0.15 native sensor module (SHA256 match)' | tee output/checks.txt

      - name: Restore the SAME Stage9 test signing certificate
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: locationspoofer-315-stage9-debug-key-v1
          lookup-only: false

      - name: Zipalign and sign Stage11 embedded-map test APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ALIGN="$(find "$SDK_DIR/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$SIGNER" && test -x "$ALIGN"
          if [ ! -s .signing/debug.keystore ]; then
            echo 'ERROR: The Stage9 signing key was not found in cache. Refusing to change SHA1 silently.' >&2
            exit 1
          fi
          FINGERPRINT=$(keytool -list -keystore .signing/debug.keystore -storepass android -alias androiddebugkey -v | sed -n 's/.*SHA1: //p' | head -n 1)
          echo "Cached signing key SHA1: $FINGERPRINT"
          if [[ "$FINGERPRINT" != '26:4D:FA:03:6D:DB:72:8E:8C:6B:91:AF:18:3D:B4:0C:80:50:B9:2D' ]]; then
            printf '%s\n' "ERROR: Different SHA1. Do not silently invalidate the registered AMap Key." >&2
            exit 1
          fi
          "$ALIGN" -f -p 4 work/unsigned.apk work/aligned.apk
          "$SIGNER" sign --ks .signing/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out output/LocationSpoofer-315-Stage11-InAppAMap-TEST.apk work/aligned.apk
          "$SIGNER" verify --verbose --print-certs output/LocationSpoofer-315-Stage11-InAppAMap-TEST.apk > output/signature-info.txt
          unzip -t output/LocationSpoofer-315-Stage11-InAppAMap-TEST.apk >/dev/null
          cat > output/READ_ME_FIRST.txt <<'EOF'
          STAGE11 EXPERIMENTAL - in-app AMap map-slot proof of integration.
          AMap is now added INSIDE the original LocationSpoofer main map view,
          not launched as a separate desktop map page. Existing MapLibre remains
          underneath as an immediate fallback; use the button '高德 / 原图'.
          It REQUIRES the Stage9 Key stored in SharedPreferences and the AMap
          privacy agreement from Stage10. Without both it silently shows old map.
          Clicked AMap coordinates are stored as GCJ-02, NOT pushed to the
          original spoof-location/route engine yet; the original view's controls
          are NOT guaranteed to function with the overlaid AMap map.
          NO cloud-account bypass, route integration or server removal is claimed.
          Keep the original pressure/altitude/Xposed native libraries unchanged.
          The original sandbox Activity is no longer a desktop launcher.
          Uses the SAME certificate SHA1 as Stage9/10; do not uninstall if update works.
          Not tested on a real Android device in CI.
          EOF

      - name: Upload experiment and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocationSpoofer-315-Stage11-InApp-AMap-TEST
          path: output/
          if-no-files-found: warn
          retention-days: 7
